name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'mac'
            args: '--target aarch64-apple-darwin' # Compiles arm64 dmg/app
          - platform: 'windows-latest'
            os_name: 'windows'
            args: '' # Compiles x64 exe/msi
          - platform: 'ubuntu-latest'
            os_name: 'linux'
            args: '' # Compiles x64 deb/AppImage

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      # Sidecars come straight from the upstream public releases so no private
      # bucket or credentials are needed.
      - name: Fetch sidecars (yt-dlp, ffmpeg, ffprobe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin
          cd src-tauri/bin

          fetch() {
            curl -fL --retry 6 --retry-delay 3 --retry-all-errors --connect-timeout 20 -o "$2" "$1"
          }

          case "${{ matrix.os_name }}" in
            windows)
              fetch "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" yt-dlp.exe
              mv yt-dlp.exe yt-dlp-x86_64-pc-windows-msvc.exe

              # gyan.dev "essentials" build: ~110 MB zipped versus ~192 MB for the
              # full build, and it still carries libmp3lame for the MP3 post-processor.
              fetch "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" ffmpeg.zip
              unzip -q -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
              rm -f ffmpeg.zip
              mv ffmpeg.exe ffmpeg-x86_64-pc-windows-msvc.exe
              mv ffprobe.exe ffprobe-x86_64-pc-windows-msvc.exe
              ;;

            linux)
              fetch "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" yt-dlp-x86_64-unknown-linux-gnu

              # LGPL build: ~13 MB smaller than the GPL variant, and SM-SAVE only
              # needs decoding, stream-copy muxing and the MP3 encoder.
              fetch "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz" ffmpeg.tar.xz
              # GNU tar only expands globs with --wildcards, so extract the archive
              # wholesale and locate the binaries instead of matching paths in tar.
              mkdir -p ffmpeg-pkg
              tar -xJf ffmpeg.tar.xz -C ffmpeg-pkg
              mv "$(find ffmpeg-pkg -type f -path '*/bin/ffmpeg' -print -quit)" ffmpeg-x86_64-unknown-linux-gnu
              mv "$(find ffmpeg-pkg -type f -path '*/bin/ffprobe' -print -quit)" ffprobe-x86_64-unknown-linux-gnu
              rm -rf ffmpeg.tar.xz ffmpeg-pkg
              ;;

            mac)
              fetch "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" yt-dlp-aarch64-apple-darwin

              # Static arm64 builds; the redirect service occasionally misses on the
              # first try, which the retry loop above absorbs.
              fetch "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" ffmpeg.zip
              fetch "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" ffprobe.zip
              unzip -q -o ffmpeg.zip -d ffmpeg-pkg
              unzip -q -o ffprobe.zip -d ffprobe-pkg
              mv "$(find ffmpeg-pkg -type f -name ffmpeg -print -quit)" ffmpeg-aarch64-apple-darwin
              mv "$(find ffprobe-pkg -type f -name ffprobe -print -quit)" ffprobe-aarch64-apple-darwin
              rm -rf ffmpeg.zip ffprobe.zip ffmpeg-pkg ffprobe-pkg
              ;;

            *)
              echo "Unsupported runner: ${{ matrix.os_name }}" >&2
              exit 1
              ;;
          esac

          chmod +x * || true
          echo "Contents of src-tauri/bin/:"
          ls -la

      # Guards the size trade-off: the smaller builds must still be functional.
      - name: Verify sidecars
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/bin
          # Write the encoder list to a file first: piping straight into `grep -q`
          # lets grep exit early, which SIGPIPEs ffmpeg and fails the step under
          # `pipefail` even though the encoder is present.
          ./ffmpeg-* -hide_banner -encoders > encoders.txt 2>&1
          grep -q "libmp3lame" encoders.txt
          rm -f encoders.txt
          ./ffprobe-* -version > /dev/null
          ./yt-dlp-* --version
          echo "sidecars OK - MP3 encoder present"

      - name: Build and package Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SM-SAVE v__VERSION__'
          args: ${{ matrix.args }}
          releaseBody: |
            ### 📦 Downloads

            | Platform | File |
            | --- | --- |
            | 🪟 **Windows 10/11 (64-bit)** | `SM-SAVE_*_x64-setup.exe` (recommended) or the `.msi` package |
            | 🍎 **macOS (Apple Silicon)** | `SM-SAVE_*_aarch64.dmg` |
            | 🐧 **Linux (64-bit)** | `.AppImage` (portable) or the smaller `.deb` / `.rpm` |

            Download, run, then launch **SM-SAVE**. `yt-dlp`, `ffmpeg` and `ffprobe` are bundled inside the installer, so nothing else needs installing — no Rust, Bun or Tauri toolchain required.

            **Linux:** the packages bundle statically linked FFmpeg, so they are larger than the Windows build — the `.deb` / `.rpm` are the lighter choice.

            ---

            ### 🍎 macOS first launch (Gatekeeper)
            SM-SAVE is distributed outside the Mac App Store without a paid Apple Developer certificate, so Gatekeeper may report:
            > *"SM-SAVE is damaged and can't be opened. You should move it to the Bin."*

            To open it:
            1. Drag **SM-SAVE.app** from the `.dmg` into **Applications**.
            2. Run `xattr -cr /Applications/SM-SAVE.app` in Terminal.
            3. Launch SM-SAVE normally.

            🪟 **Windows:** SmartScreen may warn because the build is not code-signed — choose **More info → Run anyway**.

